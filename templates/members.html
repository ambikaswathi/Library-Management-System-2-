<!DOCTYPE html>
<html>
<head>
    <title>Members - Library Management System</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Library Management System</h1>

    <div class="top-bar">
        <h2>Members Management</h2>
        <a href="{{ url_for('add_member') }}" class="btn">+ Add Member</a>
    </div>

    <table>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
        </tr>

        {% for member in members %}
        <tr>
            <td>{{ member.id }}</td>
            <td>{{ member.name }}</td>
            <td>{{ member.email }}</td>
            <td>{{ member.phone }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="4">No members available.</td>
        </tr>
        {% endfor %}

    </table>

    <br>

    <a href="{{ url_for('dashboard') }}">← Back to Dashboard</a>

</div>

</body>
</html>
