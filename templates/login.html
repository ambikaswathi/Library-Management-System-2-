<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #fff7ed,
                    #fdf2f8,
                    #f5f3ff
                );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 420px;
            background: rgba(255, 255, 255, 0.97);
            padding: 40px 45px;
            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(88, 28, 135, 0.18);

            border: 1px solid #f1e5f7;
            text-align: center;
        }

        h1 {
            color: #3b0764;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: 800;
        }

        h2 {
            color: #7c3aed;
            font-size: 20px;
            margin-bottom: 30px;
        }

        form {
            text-align: left;
        }

        label {
            display: block;
            color: #4c1d95;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin-bottom: 18px;

            border: 2px solid #e9d5ff;
            border-radius: 8px;

            font-size: 15px;
            background: #faf5ff;
        }

        input:focus {
            outline: none;
            border-color: #a855f7;
            background: white;
        }

        button {
            width: 100%;
            padding: 13px;

            background:
                linear-gradient(
                    135deg,
                    #7c3aed,
                    #db2777
                );

            color: white;
            border: none;
            border-radius: 8px;

            font-size: 16px;
            font-weight: bold;
            cursor: pointer;

            box-shadow:
                0 7px 18px rgba(124, 58, 237, 0.25);

            transition: 0.3s;
        }

        button:hover {
            transform: translateY(-2px);

            background:
                linear-gradient(
                    135deg,
                    #6d28d9,
                    #be185d
                );

            box-shadow:
                0 10px 25px rgba(219, 39, 119, 0.30);
        }

        .error {
            color: #dc2626;
            font-weight: bold;
            margin-top: 20px;
            text-align: center;
        }

        .footer {
            margin-top: 25px;
            color: #a8a29e;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Library Management System</h1>

        <h2>Admin Login</h2>

        <form method="POST">

            <label>Username:</label>
            <input
                type="text"
                name="username"
                placeholder="Username"
                required
            >

            <label>Password:</label>
            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">Login</button>

        </form>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <div class="footer">
            Secure • Simple • Efficient
        </div>

    </div>

</body>
</html>
